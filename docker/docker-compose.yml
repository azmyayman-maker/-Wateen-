# =============================================================================
# Wateen Project - Docker Compose Configuration
# Production-Grade Infrastructure with Self-Healing & Health Monitoring
# =============================================================================
# Documentation: https://docs.docker.com/compose/compose-file/
# =============================================================================
# IMPORTANT: Use .env.production for production deployments
# Run: docker-compose --env-file ../.env.production up -d
# =============================================================================

# =============================================================================
# Services Definition
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (Entry Point)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: wateen_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - wateen_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Frontend Service (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: wateen_frontend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_WS_URL=/ws
    depends_on:
      web:
        condition: service_healthy
    networks:
      - wateen_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Web Application Service (Django)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Use daphne ASGI server for HTTP + WebSocket support
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    container_name: wateen_web

    # Volume mounts for persistent data
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    # Expose port internally only (accessed via nginx)
    expose:
      - "8000"

    # Environment configuration
    env_file:
      - ../.env.production

    # Docker-internal overrides (take precedence over .env)
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}

    # Service dependencies with health conditions
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

    # Restart policy: Always restart unless explicitly stopped
    restart: unless-stopped

    # Connect to custom network for better isolation
    networks:
      - wateen_network

    # Health check for web service
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Redis Cache & Broker Service (Secured)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: wateen_redis
    # Require password authentication
    command: >
      redis-server
      --requirepass "R3d1sPr0d2026S3cur3K3yLp8nM4"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wateen_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "R3d1sPr0d2026S3cur3K3yLp8nM4", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # PostgreSQL Database Service (PostGIS) - Secured
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: wateen_db
    environment:
      - POSTGRES_DB=wateen_prod
      - POSTGRES_USER=wateen_admin
      - POSTGRES_PASSWORD=WtPr0d2026S3cur3Pssw0rdXk9mN2
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - wateen_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wateen_admin -d wateen_prod"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Security: Limit connections and set statement timeout
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "statement_timeout=30000"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"

  # ---------------------------------------------------------------------------
  # Backup Service (Optional - for automated backups)
  # ---------------------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    container_name: wateen_backup
    environment:
      - PGPASSWORD=Wt$$Pr0d!2026#S3cur3P@ssw0rd!Xk9#mN2
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - backup_volume:/backups
    networks:
      - wateen_network
    # Run backup daily at 2 AM UTC
    entrypoint: |
      sh -c 'while true; do
        pg_dump -h db -U wateen_admin -d wateen_prod -F c -f /backups/wateen_$$(date +%Y%m%d_%H%M%S).backup
        find /backups -name "*.backup" -mtime +7 -delete
        sleep 86400
      done'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - backup

# =============================================================================
# Networks Definition
# =============================================================================

networks:
  wateen_network:
    driver: bridge
    name: wateen_network
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Volumes Definition
# =============================================================================

volumes:
  postgres_data:
    name: wateen_postgres_data
  redis_data:
    name: wateen_redis_data
  static_volume:
    name: wateen_static_volume
  media_volume:
    name: wateen_media_volume
  backup_volume:
    name: wateen_backup_volume
