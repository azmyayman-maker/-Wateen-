# =============================================================================
# Wateen Project - Docker Compose Configuration
# Production-Grade Infrastructure with Self-Healing & Health Monitoring
# =============================================================================
# Documentation: https://docs.docker.com/compose/compose-file/
# =============================================================================

# =============================================================================
# Services Definition
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Web Application Service (Django)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Use daphne ASGI server for HTTP + WebSocket support
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    container_name: wateen_web

    # Volume mounts for development (remove in pure production)
    volumes:
      - ..:/app

    # Port mapping: Host:Container
    ports:
      - "8000:8000"

    # Environment configuration
    env_file:
      - ../.env

    # Docker-internal overrides (take precedence over .env)
    # .env uses localhost + test_user for local dev;
    # inside Docker we must match the db service credentials exactly.
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings

    # Service dependencies with health conditions
    # Redis Cloud is used instead of local Redis
    # depends_on removed

    # Restart policy: Always restart unless explicitly stopped
    restart: unless-stopped

    # Connect to custom network for better isolation
    networks:
      - wateen_network

    # Health check for web service
    # Verifies the Django application is responding to HTTP requests
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits (adjust based on your infrastructure)
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
# Networks Definition
# =============================================================================

networks:
  wateen_network:
    driver: bridge
    name: wateen_network
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Volumes Definition
# =============================================================================

volumes:
  # Postgres data volume removed as we are using Neon Serverless Postgres
  {}
