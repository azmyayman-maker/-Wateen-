# =============================================================================
# Wateen Project - Docker Compose Configuration
# Production-Grade Infrastructure with Self-Healing & Health Monitoring
# =============================================================================
# Documentation: https://docs.docker.com/compose/compose-file/
# =============================================================================

# =============================================================================
# Services Definition
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Web Application Service (Django)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Use daphne ASGI server for HTTP + WebSocket support
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    container_name: wateen_web

    # Volume mounts for development (remove in pure production)
    volumes:
      - ..:/app

    # Port mapping: Host:Container
    ports:
      - "8000:8000"

    # Environment configuration
    env_file:
      - ../.env

    # Docker-internal overrides (take precedence over .env)
    # .env uses localhost + test_user for local dev;
    # inside Docker we must match the db service credentials exactly.
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=wateen
      - DB_USER=wateen
      - DB_PASSWORD=wateen_secret
      - REDIS_HOST=redis
      - DJANGO_SETTINGS_MODULE=config.settings

    # Service dependencies with health conditions
    # Web waits for db and redis to be healthy before starting
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Restart policy: Always restart unless explicitly stopped
    restart: unless-stopped

    # Connect to custom network for better isolation
    networks:
      - wateen_network

    # Health check for web service
    # Verifies the Django application is responding to HTTP requests
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits (adjust based on your infrastructure)
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: wateen_db

    # Persistent data storage
    volumes:
      - postgres_data:/var/lib/postgresql/data/

    # Environment configuration
    # These use compose-level ${} substitution. Since .env is in the
    # parent directory (not docker/), variables won't resolve from .env
    # and will use the defaults specified here.
    environment:
      POSTGRES_DB: ${DB_NAME:-wateen}
      POSTGRES_USER: ${DB_USER:-wateen}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wateen_secret}

    # No external ports exposed for security (internal network only)
    # Uncomment below for external access during development
    # ports:
    #   - "127.0.0.1:5432:5432"

    # Restart policy: Always restart unless explicitly stopped
    restart: unless-stopped

    # Connect to custom network
    networks:
      - wateen_network

    # Health check for PostgreSQL
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-wateen} -d ${DB_NAME:-wateen}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Redis Cache/Broker Service
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: wateen_redis

    # Persistent data storage for Redis
    volumes:
      - redis_data:/data

    # Custom Redis configuration
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

    # No external ports exposed for security
    # ports:
    #   - "6379:6379"

    # Restart policy: Always restart unless explicitly stopped
    restart: unless-stopped

    # Connect to custom network
    networks:
      - wateen_network

    # Health check for Redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# Networks Definition
# =============================================================================

networks:
  wateen_network:
    driver: bridge
    name: wateen_network
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Volumes Definition
# =============================================================================

volumes:
  postgres_data:
    driver: local
    name: wateen_postgres_data

  redis_data:
    driver: local
    name: wateen_redis_data
