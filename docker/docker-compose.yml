# =============================================================================
# Wateen Project - Docker Compose Configuration
# Production-Grade Infrastructure with Self-Healing & Health Monitoring
# =============================================================================
# Version: 3.8+ for healthcheck condition support in depends_on
# Documentation: https://docs.docker.com/compose/compose-file/
# =============================================================================

version: "3.8"

# =============================================================================
# Services Definition
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Web Application Service (Django)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Use gunicorn for production, fallback to runserver for development
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120
    container_name: wateen_web

    # Volume mounts for development (remove in pure production)
    volumes:
      - ..:/app

    # Port mapping: Host:Container
    ports:
      - "8000:8000"

    # Environment configuration
    env_file:
      - ../.env

    # Service dependencies with health conditions
    # Web waits for db and redis to be healthy before starting
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Restart policy: Always restart unless explicitly stopped
    restart: unless-stopped

    # Connect to custom network for better isolation
    networks:
      - wateen_network

    # Health check for web service
    # Verifies the Django application is responding to HTTP requests
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s # Check every 30 seconds
      timeout: 10s # Timeout after 10 seconds
      retries: 3 # Allow 3 failures before marking unhealthy
      start_period: 40s # Give the app 40s to start before checking

    # Resource limits (adjust based on your infrastructure)
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: wateen_db

    # Persistent data storage
    volumes:
      - postgres_data:/var/lib/postgresql/data/

    # Environment configuration from .env file
    environment:
      POSTGRES_DB: ${DB_NAME:-wateen}
      POSTGRES_USER: ${DB_USER:-wateen}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wateen_secret}

    # No external ports exposed for security (internal network only)
    # Uncomment below for external access during development
    # External access for MCP/Dev tools
    ports:
      - "5432:5432"

    # Restart policy: Always restart unless explicitly stopped
    restart: unless-stopped

    # Connect to custom network
    networks:
      - wateen_network

    # Health check for PostgreSQL
    # Uses pg_isready to verify database is accepting connections
    # This checks at the application level, not just TCP connectivity
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-wateen} -d ${DB_NAME:-wateen}"]
      interval: 10s # Check every 10 seconds
      timeout: 5s # Timeout after 5 seconds
      retries: 5 # Allow 5 failures before marking unhealthy
      start_period: 30s # Give PostgreSQL 30s to initialize

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Redis Cache/Broker Service
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: wateen_redis

    # Persistent data storage for Redis
    volumes:
      - redis_data:/data

    # Custom Redis configuration
    # Enable AOF persistence for data durability
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

    # No external ports exposed for security (internal network only)
    # Uncomment below for external access during development
    # ports:
    #   - "6379:6379"

    # Restart policy: Always restart unless explicitly stopped
    restart: unless-stopped

    # Connect to custom network
    networks:
      - wateen_network

    # Health check for Redis
    # Uses redis-cli ping to verify Redis is responding
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s # Check every 10 seconds
      timeout: 5s # Timeout after 5 seconds
      retries: 5 # Allow 5 failures before marking unhealthy
      start_period: 10s # Give Redis 10s to start

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# Networks Definition
# =============================================================================

networks:
  # Custom bridge network for service isolation
  # Provides better DNS resolution and network segmentation
  wateen_network:
    driver: bridge
    name: wateen_network
    # Enable internal DNS for service discovery
    # Services can reach each other by service name
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Volumes Definition
# =============================================================================

volumes:
  # PostgreSQL persistent storage
  postgres_data:
    driver: local
    name: wateen_postgres_data

  # Redis persistent storage
  redis_data:
    driver: local
    name: wateen_redis_data
