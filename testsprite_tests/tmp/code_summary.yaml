version: "2"
type: backend
tech_stack:
  - Python
  - Django
  - PostGIS
  - Celery
  - Redis
routes:
  - path: /api/v1/visits/request/
    file: visits/request_views.py
    auth_required: true
    description: Create visit request
  - path: /api/v1/visits/estimate/
    file: visits/api.py
    auth_required: false
    description: Get price estimate
  - path: /api/v1/visits/nurse/respond-offer/
    file: visits/views.py
    auth_required: true
    description: Respond to dispatch offer
features:
  - name: Auto-Dispatch
    description: Spatial matching and offer-based dispatching
    files:
      - visits/services/dispatch.py
      - visits/tasks.py
    api_calls:
      - method: POST
        endpoint: /api/v1/visits/request/
    auth_required: true
  - name: Price Immutability
    description: Locked pricing fields in Visit model
    files:
      - visits/models.py
    auth_required: true
known_limitations:
  - issue: Environment terminal delays
    location: system
    impact: Background commands take longer to return output
