[tool.ruff]
# Target Python version
target-version = "py311"

# Same as Black's default line length
line-length = 88

# Exclude directories
exclude = [
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "migrations",
    ".wateen_cleanup_backup",
]

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle (E, W), and isort (I)
select = ["F", "E", "W", "I"]

# Never enforce these rules
ignore = ["E501", "W291", "W293", "E701", "F841", "F401", "E402"]

[tool.ruff.lint.isort]
# Sort imports by categories and alphabetically
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = ["config", "users", "visits", "notifications"]

