# =============================================================================
# Wateen Project — WebSocket-Safe Nginx Configuration
# =============================================================================
# 
# T006: WebSocket-safe log format for JWT token privacy.
# 
# SECURITY NOTE: This log format explicitly excludes the $http_sec_websocket_protocol
# variable to prevent JWT access tokens from appearing in access logs.
# 
# Medical privacy requirement: Access tokens passed via Sec-WebSocket-Protocol header
# must NEVER be logged (per ticket 025 security directive).
# =============================================================================

# WebSocket-safe log format
# Excludes $http_sec_websocket_protocol to prevent JWT leakage
log_format ws_safe '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   '$request_time $upstream_response_time '
                   '$pipe $connection $connection_requests';

# Standard WebSocket upgrade headers
# Use this map for WebSocket connections
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# WebSocket proxy configuration (include in server blocks)
# Usage:
#   location /ws/ {
#       include /etc/nginx/ws_safe.conf;
#       proxy_pass http://backend;
#   }
#
# This ensures:
# 1. Proper WebSocket upgrade handling
# 2. No JWT tokens in access logs
# 3. Correct timeout values for long-lived connections

# WebSocket proxy headers (reference only)
# proxy_http_version 1.1;
# proxy_set_header Upgrade $http_upgrade;
# proxy_set_header Connection "upgrade";
# proxy_set_header Host $host;
# proxy_set_header X-Real-IP $remote_addr;
# proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# proxy_set_header X-Forwarded-Proto $scheme;
# 
# # DO NOT LOG Sec-WebSocket-Protocol header - it contains JWT tokens
# # proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
# 
# # Extended timeouts for WebSocket connections
# proxy_read_timeout 3600s;
# proxy_send_timeout 3600s;